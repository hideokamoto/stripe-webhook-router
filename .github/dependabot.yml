version: 2
updates:
  # npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Conventional Commits configuration
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # PR management
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    # Group related dependencies
    groups:
      # Isolated so a stripe bump always lands as its own PR — this is the
      # detection mechanism for issue #54 (StripeEventMap drift). See
      # packages/stripe/MAINTAINING_STRIPE_EVENTMAP.md for the full policy.
      # The existing `check-stripe-events` job in ci.yml blocks the merge if
      # the SDK update introduces event types StripeEventMap doesn't cover.
      stripe:
        patterns:
          - "stripe"
      production:
        dependency-types:
          - "production"
        exclude-patterns:
          - "stripe"
      development:
        dependency-types:
          - "development"
        exclude-patterns:
          - "stripe"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
